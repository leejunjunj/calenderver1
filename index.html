<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>마이 스마트 캘린더 & 플래너</title>
    <style>
        :root {
            --red: #ef4444; --orange: #f97316; --green: #22c55e;
            --blue: #3b82f6; --navy: #1e3a8a; --pink: #ec4899; --purple: #a855f7;
        }
        * { box-sizing: border-box; touch-action: manipulation; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            margin: 0; padding: 12px; color: #1e293b;
            min-height: 100vh;
        }
        .container { max-width: 500px; margin: 0 auto; }
        .card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); padding: 16px; border-radius: 16px; margin-bottom: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); overflow: hidden; }
        
        /* 캘린더 헤더 */
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .calendar-header button { background: #ffe4e6; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; color: #be185d; }
        .calendar-header h2 { margin: 0; font-size: 18px; color: #831843; }

        /* 달력 그리드 */
        .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-weight: bold; color: #9f1239; font-size: 12px; margin-bottom: 6px; }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; width: 100%; }
        .day-cell { min-height: 65px; background: #fff1f2; border-radius: 6px; padding: 3px; font-size: 11px; display: flex; flex-direction: column; cursor: pointer; border: 1px solid #fecdd3; position: relative; overflow: hidden; }
        .day-cell.selected { border-color: var(--pink); background: #fce7f3; }
        .day-num { font-weight: bold; margin-bottom: 2px; color: #881337; }

        /* 기간 연결형 막대 바 스타일 */
        .event-bar { font-size: 9px; color: white; padding: 2px 4px; border-radius: 3px; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; display: block; font-weight: 500; }
        .bg-red { background: var(--red); }
        .bg-orange { background: var(--orange); }
        .bg-green { background: var(--green); }
        .bg-blue { background: var(--blue); }
        .bg-navy { background: var(--navy); }
        .bg-pink { background: var(--pink); }
        .bg-purple { background: var(--purple); }

        /* 입력 폼 스타일 */
        .input-group { margin-bottom: 10px; }
        .input-group label { display: block; font-size: 11px; font-weight: bold; color: #9f1239; margin-bottom: 3px; }
        input, select, textarea { width: 100%; padding: 8px; border: 1px solid #fbcfe8; border-radius: 8px; font-size: 13px; background: #fff; }
        .row { display: flex; gap: 6px; }
        
        .btn { background: var(--pink); color: white; border: none; padding: 10px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 4px; }
        .btn-secondary { background: #db2777; margin-top: 6px; }
        .btn-green { background: var(--green); }
        
        .timeline-item { background: #fff1f2; border-left: 4px solid var(--pink); padding: 8px; border-radius: 0 8px 8px 0; margin-bottom: 6px; font-size: 12px; }
        .subject-card { background: #fff1f2; padding: 10px; border-radius: 8px; margin-bottom: 8px; position: relative; border: 1px solid #fce7f3; }
        #aiResult { margin-top: 10px; background: #fff1f2; padding: 10px; border-radius: 8px; font-size: 12px; white-space: pre-wrap; display: none; border: 1px solid #fbcfe8; }
    </style>
</head>
<body>

<div class="container">

    <!-- 일정 입력 칸 -->
    <div class="card">
        <h4 style="margin:0 0 10px 0; font-size:15px; color:#831843;">➕ 새로운 일정 추가</h4>
        <div class="input-group">
            <label>할 일 이름</label>
            <input type="text" id="eventTitle" placeholder="예: 부산 가는 날">
        </div>
        <div class="row">
            <div class="input-group" style="flex:1;">
                <label>시작일</label>
                <input type="date" id="startDate">
            </div>
            <div class="input-group" style="flex:1;">
                <label>종료일 (기간 설정)</label>
                <input type="date" id="endDate">
            </div>
        </div>
        <div class="row">
            <div class="input-group" style="flex:1;">
                <label>시간</label>
                <input type="time" id="eventTime">
            </div>
            <div class="input-group" style="flex:1;">
                <label>카테고리</label>
                <select id="eventCategory">
                    <option value="bg-red">중요한 일</option>
                    <option value="bg-orange">일자리</option>
                    <option value="bg-green">친구</option>
                    <option value="bg-blue">학교 일</option>
                    <option value="bg-navy">과제</option>
                    <option value="bg-pink">여행</option>
                    <option value="bg-purple">기타</option>
                </select>
            </div>
        </div>
        <button class="btn" onclick="addEvent()">일정 추가하기</button>
    </div>

    <!-- 캘린더 화면 -->
    <div class="card">
        <div class="calendar-header">
            <button onclick="changeMonth(-1)">◀</button>
            <h2 id="monthYear">2026년 8월</h2>
            <button onclick="changeMonth(1)">▶</button>
        </div>
        <div class="weekdays">
            <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
        </div>
        <div class="days-grid" id="daysContainer"></div>
    </div>

    <!-- 선택한 날짜 타임라인 -->
    <div class="card">
        <h3 id="selectedDateTitle" style="margin-top:0; font-size:15px; color:#831843;">날짜를 선택하세요</h3>
        <div id="timelineContainer">
            <p style="color: #9f1239; font-size: 12px; margin: 0; opacity: 0.7;">달력에서 날짜를 누르면 일정이 표시됩니다.</p>
        </div>
    </div>

    <!-- AI 맞춤형 학습 플래너 -->
    <div class="card">
        <h2 style="margin-top:0; font-size:16px; color:#831843;">🧠 AI 맞춤형 학습 플래너</h2>
        <div id="subjectListContainer">
            <div class="subject-card">
                <div class="input-group">
                    <label>과목명</label>
                    <input type="text" class="sub-name" placeholder="예: 식품학">
                </div>
                <div class="row">
                    <div class="input-group" style="flex:1;">
                        <label>중요도 / 공부량</label>
                        <input type="text" class="sub-volume" placeholder="예: 상 (내용 많음)">
                    </div>
                    <div class="input-group" style="flex:1;">
                        <label>남은 기간 (일)</label>
                        <input type="number" class="sub-days" placeholder="예: 3">
                    </div>
                </div>
            </div>
        </div>
        <button class="btn btn-secondary" onclick="addSubjectInput()">＋ 과목 추가하기</button>
        <button class="btn" style="margin-top: 10px;" onclick="requestAiPlanner()">효율적인 스케줄 초안 짜기</button>
        
        <div id="aiResult"></div>
        <button class="btn btn-green" id="applyAiBtn" style="display:none; margin-top:8px;" onclick="applyAiSchedule()">이 스케줄로 캘린더에 적용하기 오케이!</button>
    </div>

</div>

    <script>
        let events = [
            { title: "부산 가는 날", start: "2026-08-14", end: "2026-08-17", time: "09:00", category: "bg-pink" },
            { title: "등록금 납부일", start: "2026-08-25", end: "2026-08-28", time: "10:00", category: "bg-navy" }
        ];

        let today = new Date();
        let currentYear = today.getFullYear();
        let currentMonth = today.getMonth();
        let selectedDateStr = "";

        function renderCalendar(year, month) {
            const monthYearEl = document.getElementById('monthYear');
            const daysContainer = document.getElementById('daysContainer');
            monthYearEl.innerText = `${year}년 ${month + 1}월`;
            daysContainer.innerHTML = '';

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                daysContainer.appendChild(document.createElement('div'));
            }

            for (let day = 1; day <= totalDays; day++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell';
                let mStr = String(month + 1).padStart(2, '0');
                let dStr = String(day).padStart(2, '0');
                let dateStr = `${year}-${mStr}-${dStr}`;

                if (dateStr === selectedDateStr) cell.classList.add('selected');

                cell.innerHTML = `<span class="day-num">${day}</span>`;
                cell.onclick = () => selectDate(dateStr);

                events.forEach(ev => {
                    if (dateStr >= ev.start && dateStr <= ev.end) {
                        const bar = document.createElement('div');
                        bar.className = `event-bar ${ev.category}`;
                        bar.innerText = ev.title;
                        cell.appendChild(bar);
                    }
                });

                daysContainer.appendChild(cell);
            }
        }

        function changeMonth(dir) {
            currentMonth += dir;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            else if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar(currentYear, currentMonth);
        }

        function selectDate(dateStr) {
            selectedDateStr = dateStr;
            renderCalendar(currentYear, currentMonth);

            const titleEl = document.getElementById('selectedDateTitle');
            const timelineEl = document.getElementById('timelineContainer');
            titleEl.innerText = `${dateStr} 일정 타임라인`;

            let dayEvents = events.filter(ev => dateStr >= ev.start && dateStr <= ev.end);
            
            if (dayEvents.length === 0) {
                timelineEl.innerHTML = `<p style="color: #9f1239; font-size: 12px; margin: 0; opacity: 0.7;">등록된 일정이 없습니다.</p>`;
            } else {
                timelineEl.innerHTML = dayEvents.map(ev => `
                    <div class="timeline-item">
                        <strong>${ev.time || '하루종일'}</strong> - ${ev.title} <span style="font-size:10px; color:#be185d;">(${ev.start}~${ev.end})</span>
                    </div>
                `).join('');
            }

            document.getElementById('startDate').value = dateStr;
            document.getElementById('endDate').value = dateStr;
        }

        function addEvent() {
            let title = document.getElementById('eventTitle').value;
            let start = document.getElementById('startDate').value;
            let end = document.getElementById('endDate').value || start;
            let time = document.getElementById('eventTime').value;
            let category = document.getElementById('eventCategory').value;

            if (!title || !start) {
                alert("할 일 이름과 시작일을 입력해주세요!");
                return;
            }

            events.push({ title, start, end, time, category });
            renderCalendar(currentYear, currentMonth);
            if(selectedDateStr) selectDate(selectedDateStr);

            document.getElementById('eventTitle').value = '';
            alert("일정이 추가되었습니다!");
        }

        function addSubjectInput() {
            const container = document.getElementById('subjectListContainer');
            const div = document.createElement('div');
            div.className = 'subject-card';
            div.innerHTML = `
                <div class="input-group">
                    <label>과목명</label>
                    <input type="text" class="sub-name" placeholder="예: 생물학">
                </div>
                <div class="row">
                    <div class="input-group" style="flex:1;">
                        <label>중요도 / 공부량</label>
                        <input type="text" class="sub-volume" placeholder="예: 중 (가벼움)">
                    </div>
                    <div class="input-group" style="flex:1;">
                        <label>남은 기간 (일)</label>
                        <input type="number" class="sub-days" placeholder="예: 2">
                    </div>
                </div>
            `;
            container.appendChild(div);
        }

        async function requestAiPlanner() {
            const names = document.querySelectorAll('.sub-name');
            const volumes = document.querySelectorAll('.sub-volume');
            const days = document.querySelectorAll('.sub-days');
            
            let studyData = [];
            for(let i=0; i<names.length; i++) {
                if(names[i].value) {
                    studyData.push(`과목: ${names[i].value}, 중요도/볼륨: ${volumes[i].value}, 남은기간: ${days[i].value}일`);
                }
            }

            if (studyData.length === 0) { alert("최소 한 개 이상의 과목 정보를 입력해주세요!"); return; }

            const resDiv = document.getElementById('aiResult');
            const applyBtn = document.getElementById('applyAiBtn');
            const API_KEY = "AQ.Ab8RN6KReQNM96tjBbbuTEC9QCBNQ4_smHYl6Z-mrHvQ_9fBMg"; // 👈 본인 API 키 입력

            resDiv.style.display = 'block';
            resDiv.innerText = "AI가 입력하신 과목들을 분석하여 효율적인 스케줄을 짜는 중입니다...";

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "너는 최고의 학습 플래너야. 다음 과목들의 중요도와 남은 기간을 바탕으로 최적의 공부 스케줄 초안을 짜줘:\n" + studyData.join('\n') }] }]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates.length > 0) {
                    resDiv.innerText = data.candidates[0].content.parts[0].text;
                    applyBtn.style.display = 'block';
                } else if (data.error) {
                    resDiv.innerText = "API 오류 발생: " + data.error.message;
                } else {
                    resDiv.innerText = "응답을 처리할 수 없습니다. API 키를 다시 확인해주세요.";
                }
            } catch(e) {
                resDiv.innerText = "네트워크 오류가 발생했습니다. 인터넷 연결이나 API 키를 확인해주세요.";
            }
        }

        function applyAiSchedule() {
            events.push({ title: "[AI] 맞춤형 학습 계획", start: "2026-08-22", end: "2026-08-26", time: "09:00", category: "bg-navy" });
            renderCalendar(currentYear, currentMonth);
            alert("스케줄이 캘린더에 성공적으로 반영되었습니다!");
            document.getElementById('aiResult').style.display = 'none';
            document.getElementById('applyAiBtn').style.display = 'none';
        }

        let todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
        selectDate(todayStr);
    </script>
</body>
</html>
