<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이 스마트 캘린더</title>
    <style>
        :root { --red: #ef4444; --blue: #3b82f6; --bg: #f8fafc; }
        body { font-family: sans-serif; background: var(--bg); padding: 15px; }
        .card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        /* 달력 헤더 */
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .calendar-header button { background: #e2e8f0; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        
        /* 달력 그리드 */
        .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-weight: bold; color: #64748b; margin-bottom: 5px; font-size: 14px; }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
        .day-cell { min-height: 45px; background: #f1f5f9; border-radius: 6px; padding: 4px; font-size: 14px; display: flex; flex-direction: column; justify-content: space-between; }
        
        /* 1. 이벤트 한 줄로 깔끔하게 연결되는 스타일 */
        .event-bar { height: 6px; border-radius: 3px; background: var(--red); width: 100%; margin-top: 2px; }

        /* AI 플래너 스타일 */
        textarea { width: 100%; height: 100px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; padding: 10px; box-sizing: border-box; }
        .ai-btn { background: var(--blue); color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: bold; }
        #result { margin-top: 15px; padding-top: 10px; border-top: 1px solid #eee; white-space: pre-wrap; font-size: 14px; }
    </style>
</head>
<body>

    <!-- 달력 영역 -->
    <div class="card">
        <div class="calendar-header">
            <button onclick="changeMonth(-1)">◀ 이전</button>
            <h2 id="monthYear" style="margin: 0; font-size: 18px;">2026년 8월</h2>
            <button onclick="changeMonth(1)">다음 ▶</button>
        </div>
        <div class="weekdays">
            <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
        </div>
        <div class="days-grid" id="daysContainer">
            <!-- 날짜가 자바스크립트로 자동 생성됩니다 -->
        </div>
    </div>

    <!-- AI 학습 플래너 영역 -->
    <div class="card">
        <h2>🧠 AI 학습 플래너</h2>
        <p style="font-size: 13px; color: #64748b; margin-top: 0;">공부할 내용과 중요도를 편하게 적어주세요.</p>
        <textarea id="userInput" placeholder="예: 식품학은 내용이 많고 중요해서 3일 정도 집중해야 해. 생물학은 가볍게 복습만 하면 돼."></textarea>
        <button class="ai-btn" onclick="getSchedule()">스케줄 짜달라고 하기</button>
        <div id="result"></div>
    </div>

    <script>
        // 달력 생성 로직
        let today = new Date();
        let currentYear = today.getFullYear();
        let currentMonth = today.getMonth();

        function renderCalendar(year, month) {
            const monthYearEl = document.getElementById('monthYear');
            const daysContainer = document.getElementById('daysContainer');
            
            monthYearEl.innerText = `${year}년 ${month + 1}월`;
            daysContainer.innerHTML = '';

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();

            // 빈 칸 채우기 (전 달 공백)
            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                daysContainer.appendChild(emptyCell);
            }

            // 날짜 채우기
            for (let day = 1; day <= totalDays; day++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell';
                cell.innerHTML = `<span>${day}</span>`;
                
                // 예시로 특정 날짜(예: 15일, 16일, 17일)에 이벤트 바가 끊김 없이 이어지도록 테스트 표시
                if (day >= 15 && day <= 17) {
                    const bar = document.createElement('div');
                    bar.className = 'event-bar';
                    cell.appendChild(bar);
                }

                daysContainer.appendChild(cell);
            }
        }

        function changeMonth(direction) {
            currentMonth += direction;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            } else if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar(currentYear, currentMonth);
        }

        // 초기 달력 실행
        renderCalendar(currentYear, currentMonth);

        // AI 스케줄 생성 함수 (API 키 입력 필요)
        async function getSchedule() {
            const input = document.getElementById('userInput').value;
            const resDiv = document.getElementById('result');
            
            // 👇 여기에 아까 발급받으신 본인의 API 키를 넣어주세요!
            const API_KEY = "AQ.Ab8RN6KReQNM96tjBbbuTEC9QCBNQ4_smHYl6Z-mrHvQ_9fBMg";
            
            if(!input.trim()) {
                alert("내용을 입력해주세요!");
                return;
            }

            resDiv.innerText = "AI가 학습 내용을 분석 중입니다...";

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "너는 최고의 학습 플래너야. 사용자가 입력한 내용을 바탕으로 효율적인 공부 스케줄을 짜줘. 입력내용: " + input }] }]
                    })
                });
                const data = await response.json();
                resDiv.innerText = data.candidates[0].content.parts[0].text;
            } catch (e) {
                resDiv.innerText = "오류가 발생했습니다. API 키를 정확히 입력했는지 확인해주세요.";
            }
        }
    </script>
</body>
</html>
