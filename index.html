<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이 스마트 캘린더</title>
    <style>
        body { font-family: sans-serif; background: #f8fafc; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        /* 1. 달력 스타일 */
        #calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .days { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
        
        /* 2. 이벤트 한 줄로 연결되는 스타일 */
        .event-bar { height: 10px; border-radius: 5px; margin: 2px 0; width: 100%; display: block; }
        
        /* 3. 스케줄러 스타일 */
        textarea { width: 100%; height: 100px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; padding: 10px; }
        button { background: #3b82f6; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- 캘린더 영역 -->
    <div class="card">
        <div id="calendar-header">
            <button onclick="prevMonth()" style="width: 50px;">&lt;</button>
            <h2 id="month-year">2026년 8월</h2>
            <button onclick="nextMonth()" style="width: 50px;">&gt;</button>
        </div>
        <div class="days" id="calendar-body">
            <!-- 달력 날짜가 여기 들어갑니다 -->
        </div>
        <!-- 연결된 이벤트 예시 -->
        <div class="event-bar" style="background: #ef4444;"></div>
    </div>

    <!-- AI 스케줄러 영역 -->
    <div class="card">
        <h2>🧠 AI 학습 플래너</h2>
        <textarea id="userInput" placeholder="과목과 중요도를 자연스럽게 적어주세요."></textarea>
        <button onclick="getSchedule()">스케줄 짜달라고 하기</button>
        <div id="result"></div>
    </div>

    <script>
        // 달력 넘기기 기능
        function prevMonth() { /* 이전 달 로직 */ }
        function nextMonth() { /* 다음 달 로직 */ }

        // AI 스케줄 생성 (API 키를 여기에 넣어주세요)
        async function getSchedule() {
            const input = document.getElementById('userInput').value;
            const resDiv = document.getElementById('result');
            const API_KEY = "AQ.Ab8RN6KReQNM96tjBbbuTEC9QCBNQ4_smHYl6Z-mrHvQ_9fBMg";
            
            resDiv.innerText = "분석 중입니다...";
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: "사용자 요청: " + input }] }] })
            });
            const data = await response.json();
            resDiv.innerText = data.candidates[0].content.parts[0].text;
        }
    </script>
</body>
</html>
