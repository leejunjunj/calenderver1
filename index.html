<div class="planner-box" style="border: 1px solid #ccc; padding: 20px; border-radius: 10px; max-width: 400px; margin: 20px 0;">
  <h3>📝 간편 공부 계획기</h3>
  
  <!-- 1. 과목명 입력 -->
  <div style="margin-bottom: 12px;">
    <label for="subject" style="display: block; font-weight: bold; margin-bottom: 4px;">과목명</label>
    <input type="text" id="subject" placeholder="예: 식품화학" style="width: 100%; padding: 8px; box-sizing: border-box;">
  </div>

  <!-- 2. 난이도 / 중요도 선택 -->
  <div style="margin-bottom: 12px;">
    <label for="importance" style="display: block; font-weight: bold; margin-bottom: 4px;">난이도 / 중요도</label>
    <select id="importance" style="width: 100%; padding: 8px;">
      <option value="최상">최상 (우선순위 매우 높음)</option>
      <option value="상">상 (우선순위 높음)</option>
      <option value="중">중 (우선순위 보통)</option>
      <option value="하">하 (우선순위 낮음)</option>
    </select>
  </div>

  <!-- 3. 시작 기간 선택 -->
  <div style="margin-bottom: 12px;">
    <label for="startDate" style="display: block; font-weight: bold; margin-bottom: 4px;">시작 기간</label>
    <input type="date" id="startDate" style="width: 100%; padding: 8px; box-sizing: border-box;">
  </div>

  <!-- 4. 종료 기간 선택 -->
  <div style="margin-bottom: 15px;">
    <label for="endDate" style="display: block; font-weight: bold; margin-bottom: 4px;">종료 기간</label>
    <input type="date" id="endDate" style="width: 100%; padding: 8px; box-sizing: border-box;">
  </div>

  <!-- 계획 생성 버튼 -->
  <button onclick="generatePlan()" style="width: 100%; padding: 10px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">
    계획 짜기
  </button>

  <!-- 결과 출력 영역 -->
  <div id="planResult" style="margin-top: 20px;"></div>
</div>
