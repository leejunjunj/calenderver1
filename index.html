<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>간편 공부 계획 플래너</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #f5f7fa;
      display: flex;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }
    .planner-card {
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 480px;
    }
    h2 {
      margin-top: 0;
      color: #333;
      font-size: 1.4rem;
      margin-bottom: 20px;
      text-align: center;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      color: #444;
      font-size: 0.95rem;
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      border-color: #4CAF50;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      transition: background-color 0.2s;
    }
    .btn-submit:hover {
      background-color: #45a049;
    }
    .result-box {
      margin-top: 24px;
      padding: 16px;
      background-color: #f8fdf8;
      border: 1px solid #c8e6c9;
      border-radius: 12px;
      display: none;
    }
    .result-title {
      font-weight: bold;
      font-size: 1.1rem;
      color: #2e7d32;
      margin-top: 0;
      margin-bottom: 12px;
    }
    .result-info {
      font-size: 0.9rem;
      color: #555;
      margin: 4px 0;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
      background-color: #e8f5e9;
      color: #2e7d32;
    }
    .phase-list {
      padding-left: 18px;
      margin-top: 10px;
      margin-bottom: 0;
      font-size: 0.92rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>

<div class="planner-card">
  <h2>📝 간편 공부 계획기</h2>

  <!-- 1. 과목명 -->
  <div class="form-group">
    <label for="subject">과목명</label>
    <input type="text" id="subject" placeholder="예: 식품화학">
  </div>

  <!-- 2. 난이도 / 중요도 -->
  <div class="form-group">
    <label for="importance">난이도 / 중요도</label>
    <select id="importance">
      <option value="최상">최상 (우선순위 매우 높음)</option>
      <option value="상" selected>상 (우선순위 높음)</option>
      <option value="중">중 (우선순위 보통)</option>
      <option value="하">하 (우선순위 낮음)</option>
    </select>
  </div>

  <!-- 3. 시작 기간 -->
  <div class="form-group">
    <label for="startDate">시작 기간</label>
    <input type="date" id="startDate">
  </div>

  <!-- 4. 종료 기간 -->
  <div class="form-group">
    <label for="endDate">종료 기간</label>
    <input type="date" id="endDate">
  </div>

  <!-- 생성 버튼 -->
  <button class="btn-submit" onclick="generatePlan()">계획 자동 생성하기</button>

  <!-- 결과 출력 영역 -->
  <div id="resultBox" class="result-box">
    <div id="resultContent"></div>
  </div>
</div>

<script>
  function generatePlan() {
    const subject = document.getElementById('subject').value.trim();
    const importance = document.getElementById('importance').value;
    const startDateStr = document.getElementById('startDate').value;
    const endDateStr = document.getElementById('endDate').value;

    if (!subject || !startDateStr || !endDateStr) {
      alert('모든 항목을 입력해주세요!');
      return;
    }

    const start = new Date(startDateStr);
    const end = new Date(endDateStr);

    if (start > end) {
      alert('시작 날짜는 종료 날짜보다 빨라야 합니다.');
      return;
    }

    // 총 기간(일수) 계산
    const diffTime = Math.abs(end - start);
    const totalDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;

    // 중요도별 권장 일일 학습량
    let dailyTime = "";
    switch(importance) {
      case '최상': dailyTime = "매일 2.5 ~ 3시간 이상 집중 투자"; break;
      case '상':   dailyTime = "매일 1.5 ~ 2시간 집중 투자"; break;
      case '중':   dailyTime = "매일 1시간 내외 투자"; break;
      case '하':   dailyTime = "매일 30분~1시간 가볍게 복습"; break;
    }

    // 50% / 35% / 15% 비율 적용
    let phase1Days = Math.round(totalDays * 0.50); // 개념 정리 (50%)
    let phase2Days = Math.round(totalDays * 0.35); // 심화 문제 (35%)
    let phase3Days = totalDays - phase1Days - phase2Days; // 최종 총복습 (15%)

    // 일수가 너무 적을 경우 최소 1일 보장 예외 처리
    if (phase1Days < 1) phase1Days = 1;
    if (totalDays >= 2 && phase2Days < 1) phase2Days = 1;
    if (totalDays >= 3 && phase3Days < 1) {
      phase3Days = 1;
      phase2Days = Math.max(1, totalDays - phase1Days - phase3Days);
    }

    // 날짜 계산 보장
    const p1End = phase1Days;
    const p2Start = p1End + 1;
    const p2End = p1End + phase2Days;
    const p3Start = p2End + 1;

    const resultBox = document.getElementById('resultBox');
    const resultContent = document.getElementById('resultContent');

    resultContent.innerHTML = `
      <div class="result-title">📚 [${subject}] 맞춤 공부 계획</div>
      <div class="result-info"><strong>총 기간:</strong> ${totalDays}일 (${startDateStr} ~ ${endDateStr})</div>
      <div class="result-info"><strong>난이도/중요도:</strong> <span class="badge">${importance}</span></div>
      <div class="result-info" style="color: #2e7d32; margin-top: 6px;"><strong>추천 학습량:</strong> ${dailyTime}</div>
      <hr style="margin: 12px 0; border: 0; border-top: 1px solid #c8e6c9;">
      
      <div style="font-weight: bold; margin-bottom: 6px; font-size: 0.95rem;">📍 단계별 비중 계획 (50% / 35% / 15%):</div>
      <ol class="phase-list">
        <li><strong>개념 정리 (50%):</strong> 1 ~ ${p1End}일차 (${phase1Days}일간)<br>
            <span style="color: #666; font-size: 0.85rem;">기본 개념 파악, 핵심 이론 정리 및 요약 노트 작성</span></li>
        <li><strong>심화문제 (35%):</strong> ${p2Start} ~ ${p2End}일차 (${phase2Days}일간)<br>
            <span style="color: #666; font-size: 0.85rem;">기출 문제 풀이, 심화 유형 연습 및 오답 체크</span></li>
        <li><strong>최종 총복습 (15%):</strong> ${p3Start} ~ ${totalDays}일차 (${phase3Days}일간)<br>
            <span style="color: #666; font-size: 0.85rem;">전체 내용 총복습, 오답노트 점검 및 최종 암기</span></li>
      </ol>
    `;

    resultBox.style.display = 'block';
  }
</script>

</body>
</html>
