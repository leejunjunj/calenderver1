<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이 스마트 캘린더</title>
    <style>
        :root {
            --red: #ef4444;     /* 중요한 일 */
            --orange: #f97316;  /* 일자리 */
            --green: #22c55e;   /* 친구 */
            --blue: #3b82f6;    /* 학교 일 */
            --navy: #1e3a8a;    /* 과제 */
            --pink: #ec4899;    /* 여행 */
            --purple: #8b5cf6;  /* 기타 */
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 16px; max-width: 500px; margin: 0 auto; }

        h1, h2 { font-size: 1.2rem; margin-bottom: 12px; font-weight: 700; }

        /* 카드 박스 공통 스타일 */
        .card { background: var(--card); padding: 16px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 16px; }

        /* 1. 상단 일정 입력 폼 */
        .form-grid { display: grid; gap: 8px; }
        .row { display: flex; gap: 8px; }
        input, select, button { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; outline: none; }
        input:focus, select:focus { border-color: #3b82f6; }
        
        .btn-primary { background: #0f172a; color: white; font-weight: bold; border: none; cursor: pointer; }
        .btn-primary:active { opacity: 0.8; }

        /* 2. 달력 스타일 */
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .calendar-header button { width: auto; padding: 6px 12px; background: #f1f5f9; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        
        .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 0.85rem; font-weight: bold; color: #64748b; margin-bottom: 6px; }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        
        .day-cell { 
            aspect-ratio: 1 / 1; background: #f8fafc; border-radius: 8px; padding: 4px; font-size: 0.85rem; 
            cursor: pointer; display: flex; flex-direction: column; justify-content: flex-start; align-items: center;
            border: 1px solid transparent; position: relative; overflow: hidden;
        }
        .day-cell:hover { background: #f1f5f9; }
        .day-cell.selected { border-color: #0f172a; background: #e2e8f0; font-weight: bold; }
        .day-cell.other-month { color: #cbd5e1; }
        
        /* 일정 바 스타일 */
        .event-bar {
            width: 100%; font-size: 0.65rem; color: white; padding: 1px 4px; border-radius: 3px;
            margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left;
        }

        /* 카테고리 색상 매핑 */
        .bg-red { background-color: var(--red); }
        .bg-orange { background-color: var(--orange); }
        .bg-green { background-color: var(--green); }
        .bg-blue { background-color: var(--blue); }
        .bg-navy { background-color: var(--navy); }
        .bg-pink { background-color: var(--pink); }
        .bg-purple { background-color: var(--purple); }

        /* 3. 선택된 날짜 상세 일정 리스트 (스크린샷 2 형태) */
        .detail-date-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 10px; color: #0f172a; }
        .detail-item { 
            background: #f8fafc; border-left: 4px solid #cbd5e1; padding: 10px; border-radius: 8px; 
            margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
        }
        .detail-info .time { font-size: 0.8rem; color: #64748b; font-weight: bold; }
        .detail-info .title { font-size: 0.95rem; font-weight: bold; margin-top: 2px; }
        .delete-btn { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 0.85rem; width: auto; padding: 4px 8px; }

        /* 4. 하단 AI 공부 일정 짜기 섹션 */
        .study-box { background: #eff6ff; border: 1px solid #bfdbfe; }
    </style>
</head>
<body>

    <!-- 1. 일정 직접 입력 카드 -->
    <div class="card">
        <h2>✨ 새로운 일정 추가</h2>
        <div class="form-grid">
            <div class="row">
                <input type="date" id="startDate" style="flex:1;">
                <span style="align-self:center;">~</span>
                <input type="date" id="endDate" style="flex:1;">
            </div>
            <div class="row">
                <input type="time" id="eventTime" style="flex:1;">
                <select id="eventCategory" style="flex:1;">
                    <option value="red">🔴 중요한 일</option>
                    <option value="orange">🟠 일자리</option>
                    <option value="green">🟢 친구</option>
                    <option value="blue">🔵 학교 일</option>
                    <option value="navy">🔷 과제</option>
                    <option value="pink">🩷 여행</option>
                    <option value="purple">🟣 기타</option>
                </select>
            </div>
            <input type="text" id="eventTitle" placeholder="할 일을 입력하세요 (예: 팀 프로젝트 회의)">
            <button class="btn-primary" onclick="addCustomEvent()">일정 추가하기</button>
        </div>
    </div>

    <!-- 2. 달력 카드 -->
    <div class="card">
        <div class="calendar-header">
            <button onclick="changeMonth(-1)">◀</button>
            <h2 id="calendarMonthTitle" style="margin:0;">2026년 8월</h2>
            <button onclick="changeMonth(1)">▶</button>
        </div>
        <div class="weekdays">
            <div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div><div>일</div>
        </div>
        <div class="days-grid" id="daysGrid"></div>
    </div>

    <!-- 3. 선택된 날짜의 상세 일정 리스트 -->
    <div class="card">
        <div class="detail-date-title" id="selectedDateTitle">날짜를 선택하세요</div>
        <div id="detailEventList">
            <p style="color: #64748b; font-size: 0.9rem;">달력의 날짜를 누르면 해당 날짜의 일정이 시간 순서대로 표시됩니다.</p>
        </div>
    </div>

    <!-- 4. 하단 AI 공부 일정 자동 생성기 -->
    <div class="card study-box">
        <h2>📚 AI 맞춤형 공부 일정 생성기</h2>
        <div class="form-grid">
            <input type="text" id="studySubject" placeholder="과목 이름 (예: 미생물학)">
            <div class="row">
                <input type="number" id="studyAmount" placeholder="공부할 분량 (예: 총 10단원)" style="flex:1;">
                <input type="number" id="studyDays" placeholder="남은 D-Day (예: 5일)" style="flex:1;">
            </div>
            <button class="btn-primary" onclick="generateStudyPlanPreview()" style="background:#2563eb;">효율적인 공부 계획 미리보기</button>
        </div>
        <!-- 미리보기 영역 -->
        <div id="studyPreviewArea" style="margin-top: 12px; display: none;">
            <div id="previewContent" style="background: white; padding: 10px; border-radius: 8px; font-size: 0.9rem; margin-bottom: 8px; border:1px solid #bfdbfe;"></div>
            <button class="btn-primary" onclick="applyStudyPlan()" style="background:#16a34a;">오케이! 위 달력에 이 일정 바로 넣기</button>
        </div>
    </div>

    <script>
        // 데이터 저장소 (브라우저에 영구 저장)
        let events = JSON.parse(localStorage.getItem('my_events')) || [
            { id: 1, title: '부산 가는 날', start: '2026-08-14', end: '2026-08-16', time: '', category: 'pink' },
            { id: 2, title: '등록금 납부일', start: '2026-08-25', end: '2026-08-28', time: '10:00', category: 'red' },
            { id: 3, title: '학교 책 반납일', start: '2026-08-25', end: '2026-08-25', time: '14:00', category: 'blue' }
        ];

        let currentDate = new Date(2026, 7, 21); // 2026년 8월 기준 초기 설정
        let selectedDateStr = '2026-08-25'; // 기본 선택일
        let tempGeneratedPlan = null; // AI 임시 생성 데이터 저장용

        // 카테고리 컬러 매핑 이름
        const colorMap = {
            red: 'bg-red', orange: 'bg-orange', green: 'bg-green', 
            blue: 'bg-blue', navy: 'bg-navy', pink: 'bg-pink', purple: 'bg-purple'
        };

        // 초기 실행
        renderCalendar();
        renderDetailList(selectedDateStr);

        // 달력 렌더링 함수
        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            document.getElementById('calendarMonthTitleinnerText', document.getElementById('calendarMonthTitle').innerText = `${year}년 ${month + 1}월`);

            const firstDayIndex = new Date(year, month, 1).getDay();
            // 월요일 시작 기준으로 맞추기 (일요일=0을 7로 변환)
            const startDayModifier = (firstDayIndex === 0) ? 6 : firstDayIndex - 1;
            
            const lastDay = new Date(year, month + 1, 0).getDate();
            const prevLastDay = new Date(year, month, 0).getDate();

            const daysGrid = document.getElementById('daysGrid');
            daysGrid.innerHTML = '';

            let html = '';

            // 이전 달 여백 날짜
            for (let i = startDayModifier - 1; i >= 0; i--) {
                const prevDateStr = `${month === 0 ? year-1 : year}-${String(month === 0 ? 12 : month).padStart(2, '0')}-${String(prevLastDay - i).padStart(2, '0')}`;
                html += `<div class="day-cell other-month" onclick="selectDate('${prevDateStr}')"><span>${prevLastDay - i}</span></div>`;
            }

            // 이번 달 날짜
            for (let i = 1; i <= lastDay; i++) {
                const monthStr = String(month + 1).padStart(2, '0');
                const dayStr = String(i).padStart(2, '0');
                const dateStr = `${year}-${monthStr}-${dayStr}`;
                const isSelected = (dateStr === selectedDateStr) ? 'selected' : '';

                // 해당 날짜에 포함되는 이벤트 필터링
                const dayEvents = events.filter(ev => dateStr >= ev.start && dateStr <= ev.end);

                let eventBarsHtml = '';
                dayEvents.slice(0, 3).forEach(ev => { // 최대 3개까지만 칸에 표시
                    eventBarsHtml += `<div class="event-bar ${colorMap[ev.category] || 'bg-blue'}">${ev.title}</div>`;
                });
                if(dayEvents.length > 3) {
                    eventBarsHtml += `<div style="font-size:0.6rem; color:#64748b; text-align:right;">+${dayEvents.length - 3}개 더</div>`;
                }

                html += `
                    <div class="day-cell ${isSelected}" onclick="selectDate('${dateStr}')">
                        <span>${i}</span>
                        ${eventBarsHtml}
                    </div>
                `;
            }

            daysGrid.innerHTML = html;
        }

        // 월 변경 버튼
        function changeMonth(direction) {
            currentDate.setMonth(currentDate.getMonth() + direction);
            renderCalendar();
        }

        // 날짜 선택 시 하단에 리스트 출력
        function selectDate(dateStr) {
            selectedDateStr = dateStr;
            renderCalendar();
            renderDetailList(dateStr);
        }

        function renderDetailList(dateStr) {
            const titleEl = document.getElementById('selectedDateTitle');
            const listEl = document.getElementById('detailEventList');
            
            const [y, m, d] = dateStr.split('-');
            titleEl.innerText = `${y}년 ${Number(m)}월 ${Number(d)}일의 일정`;

            const dayEvents = events.filter(ev => dateStr >= ev.start && dateStr <= ev.end);
            
            // 시간순 정렬 (시간 없는 것은 맨 뒤로)
            dayEvents.sort((a, b) => {
                if(!a.time) return 1;
                if(!b.time) return -1;
                return a.time.localeCompare(b.time);
            });

            if(dayEvents.length === 0) {
                listEl.innerHTML = `<p style="color: #64748b; font-size: 0.9rem;">등록된 일정이 없습니다.</p>`;
                return;
            }

            let html = '';
            dayEvents.forEach(ev => {
                const timeText = ev.time ? `${ev.time}` : '하루종일';
                const periodText = (ev.start !== ev.end) ? ` (${ev.start} ~ ${ev.end})` : '';
                
                html += `
                    <div class="detail-item" style="border-left-color: var(--${ev.category});">
                        <div class="detail-info">
                            <div class="time">${timeText}${periodText}</div>
                            <div class="title">${ev.title}</div>
                        </div>
                        <button class="delete-btn" onclick="deleteEvent(${ev.id})">삭제</button>
                    </div>
                `;
            });
            listEl.innerHTML = html;
        }

        // 새 일정 추가
        function addCustomEvent() {
            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value || start;
            const time = document.getElementById('eventTime').value;
            const category = document.getElementById('eventCategory').value;
            const title = document.getElementById('eventTitle').value;

            if(!start || !title) {
                alert('시작 날짜와 할 일 제목은 필수 입력입니다!');
                return;
            }

            const newEvent = { id: Date.now(), title, start, end, time, category };
            events.push(newEvent);
            localStorage.setItem('my_events', JSON.stringify(events));

            document.getElementById('eventTitle').value = '';
            renderCalendar();
            renderDetailList(selectedDateStr);
        }

        // 일정 삭제
        function deleteEvent(id) {
            events = events.filter(ev => ev.id !== id);
            localStorage.setItem('my_events', JSON.stringify(events));
            renderCalendar();
            renderDetailList(selectedDateStr);
        }

        // --- AI 공부 일정 자동 생성 로직 ---
        function generateStudyPlanPreview() {
            const subject = document.getElementById('studySubject').value;
            const amount = Number(document.getElementById('studyAmount').value);
            const days = Number(document.getElementById('studyDays').value);

            if(!subject || !amount || !days) {
                alert('과목명, 분량, 남은 날짜를 모두 입력해주세요!');
                return;
            }

            // 효율적 분배 알고리즘 계산
            const perDay = Math.ceil(amount / days);
            let planText = `📖 <b>[${subject}] 추천 공부 계획 (${days}일간)</b><br>`;
            
            const today = new Date();
            tempGeneratedPlan = [];

            for(let i = 0; i < days; i++) {
                let targetDate = new Date(today);
                targetDate.setDate(today.getDate() + i);
                const dateStr = targetDate.toISOString().split('T')[0];
                
                const startRange = (i * perDay) + 1;
                const endRange = Math.min((i + 1) * perDay, amount);
                const taskDesc = `${subject} ${startRange}~${endRange}단원(범위) 학습`;

                planText += `• ${dateStr}: ${taskDesc}<br>`;
                
                tempGeneratedPlan.push({
                    title: `[공부] ${taskDesc}`,
                    start: dateStr,
                    end: dateStr,
                    time: '09:00',
                    category: 'navy' // 과제/공부 남색 카테고리 적용
                });
            }

            document.getElementById('previewContent').innerHTML = planText;
            document.getElementById('studyPreviewArea').style.display = 'block';
        }

        // 생성된 공부 계획을 실제 달력에 반영
        function applyStudyPlan() {
            if(!tempGeneratedPlan || tempGeneratedPlan.length === 0) return;

            tempGeneratedPlan.forEach(item => {
                events.push({ id: Date.now() + Math.random(), ...item });
            });

            localStorage.setItem('my_events', JSON.stringify(events));
            renderCalendar();
            renderDetailList(selectedDateStr);
            
            document.getElementById('studyPreviewArea').style.display = 'none';
            alert('공부 일정이 달력에 성공적으로 추가되었습니다!');
        }
    </script>
</body>
</html>
